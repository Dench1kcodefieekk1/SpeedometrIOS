on:
  workflow_dispatch:
    inputs:
      signing:
        description: 'Sign and export a distributable IPA (requires signing secrets)'
        required: true
        default: 'enabled'
        type: choice
        options:
          - enabled
          - disabled

env:
  XCODE_PROJECT: SpeedoTrack.xcodeproj
  SCHEME: SpeedoTrack
  ARCHIVE_PATH: build/SpeedoTrack.xcarchive
  EXPORT_PATH: build/ipa

jobs:
  build:
    name: Build & Export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Set up signing
        if: github.event.inputs.signing == 'enabled'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${PROVISION_PROFILE_BASE64:-}" ] \
            || [ -z "${DEVELOPMENT_TEAM:-}" ] || [ -z "${PROVISIONING_PROFILE_NAME:-}" ]; then
            echo "::error::Missing signing secrets. Configure BUILD_CERTIFICATE_BASE64, P12_PASSWORD, PROVISION_PROFILE_BASE64, DEVELOPMENT_TEAM and PROVISIONING_PROFILE_NAME in the repository settings — or rerun this workflow with 'signing: disabled' to run an unsigned compile check."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="${KEYCHAIN_PASSWORD:-speedotrack-keychain}"

          # 1. Create a temporary keychain and make it the default.
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          # 2. Import the distribution certificate (.p12).
          CERT_PATH="$RUNNER_TEMP/distribution.p12"
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "${P12_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH"

          # 3. Install the provisioning profile.
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(grep -a -A 1 '<key>UUID</key>' "$PROFILE_PATH" | grep -a '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "Signing identity and provisioning profile imported."

      - name: Archive
        env:
          SIGNING: ${{ github.event.inputs.signing }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail

          if [ "$SIGNING" = "enabled" ]; then
            xcodebuild archive \
              -project "$XCODE_PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "$ARCHIVE_PATH" \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"
          else
            echo "Signing disabled — running an unsigned compile check."
            xcodebuild build \
              -project "$XCODE_PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Export IPA
        if: github.event.inputs.signing == 'enabled'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          # Inject the real signing identities into the export options template.
          sed -i '' "s/YOUR_TEAM_ID/${DEVELOPMENT_TEAM}/g" ExportOptions.plist
          sed -i '' "s/YOUR_PROVISIONING_PROFILE_NAME/${PROVISIONING_PROFILE_NAME}/g" ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$EXPORT_PATH"

      - name: Upload IPA artifact
        if: github.event.inputs.signing == 'enabled'
        uses: actions/upload-artifact@v6
        with:
          name: SpeedoTrack-IPA
          path: ${{ env.EXPORT_PATH }}/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs artifact
        if: github.event.inputs.signing == 'enabled'
        uses: actions/upload-artifact@v6
        with:
          name: SpeedoTrack-dSYMs
          path: ${{ env.ARCHIVE_PATH }}/dSYMs/*.dSYM
          if-no-files-found: ignore
          retention-days: 14
